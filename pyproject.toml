[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwellm"
version = "0.1.0"
description = "Blackwell-native CUDA inference engine for SM120 GPUs — custom attention kernels, FP8 KV cache, MTP speculative decoding, 256K context."
requires-python = ">=3.10"

[project.optional-dependencies]
cuda = ["numpy>=2,<3", "safetensors>=0.6.2", "torch==2.11.0"]
dev = ["pytest>=8", "ruff>=0.8"]
serving = ["requests>=2.31", "transformers>=4.45", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
# Still required for server/runtime to actually start, not benchmarks-only --
# not yet reducible to that. See tests/test_vllm_dependency_boundary.py for
# the exact, currently-approved list of files with direct vLLM imports (11 in
# runtime/, mostly deliberate: FusedMoE (kept by explicit decision, see
# notes/2026-07-27-vllm-complete-removal-implementation-plan.md 阶段2),
# VocabParallelEmbedding/ParallelLMHead/LogitsProcessor/SpeculativeConfig/
# ModelConfig (self-build deferred, same notes doc 阶段2/阶段3), plus a few
# CUDA-op call sites (bf_attention.py's reshape_and_cache_flash,
# laguna_cuda_graph.py/laguna_dflash_cudagraph.py) predating this effort.
vllm-provider = ["vllm==0.26.0"]

[project.scripts]
bf = "bfdiag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# benchmarks/ and tests/debug/ hold diagnostic microbench/probe/repro/debug
# scripts that deliberately use compact one-liners, scratch variables,
# env-var-before-import setup (E402), short loop variable names (E741), and
# broad except blocks to keep printing partial diagnostics on failure (E722).
# Keep the bug-catching rules active (F821 undefined-name, F811 redefinition,
# F401 unused-import, E9xx syntax) but relax pure style rules so that
# `ruff check .` stays green and enforceable for the production packages
# (runtime/, server/, loader/, model/, oracle/).
"benchmarks/*" = ["E401", "E402", "E501", "E701", "E702", "E722", "E741", "I001", "F841"]
"tests/debug/*" = ["E401", "E402", "E501", "E701", "E702", "E722", "E741", "I001", "F841"]
# Historical vLLM source snapshots are retained as investigation evidence,
# not maintained production modules. Keep their lint gate limited to rules
# that can catch accidental undefined names or syntax errors.
"notes/2026-07-22-vllm-sm120_gqa-backup.py" = ["E501", "I001"]

[tool.setuptools.packages.find]
include = [
  "bfdiag*",
  "bfprobe*",
  "benchmarks*",
  "loader*",
  "model*",
  "oracle*",
  "runtime*",
  "server*",
]
