name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff lint (whole repo)
        run: python -m ruff check .

      - name: Ruff format check (production packages)
        run: python -m ruff format --check runtime server loader model oracle tests tools

      # Unit tests are CPU-only; torch-dependent tests self-skip via
      # pytest.importorskip when torch is absent, so no GPU or CUDA wheel
      # is needed here. This job is the contract's gatekeeper: if it goes
      # red, something reintroduced a bare torch import (or another
      # unguarded optional dependency) into a module pytest collects here.
      - name: Unit tests (CPU-only)
        run: python -m pytest -q

  test-cpu-torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Several test modules are guarded only by pytest.importorskip("torch")
      # and then import, at module scope, something that merely travels with
      # torch in a real GPU venv -- numpy, huggingface_hub, transformers,
      # safetensors. Once torch is installed the guard passes and those
      # imports run for real, so a torch-only install errors at collection
      # instead of skipping.
      #
      # Those four live in the `cpu-test` extra rather than being listed here.
      # This job used to rely on `serving` carrying transformers transitively;
      # T0-6 moved transformers to `cuda` and that assumption broke silently,
      # leaving the job red. Declaring the requirement in pyproject.toml puts
      # it next to the version contract it belongs to, where the same edit
      # cannot break it again without being visible.
      #
      # torch comes from PyTorch's CPU index (not the pinned CUDA build), and
      # triton is installed separately because its wheel is Linux-only. None
      # of this needs a GPU to import; sparkinfer and cutlass are deliberately
      # absent, so GPU-only tests still self-skip via their own guards.
      - name: Install dev dependencies + CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,serving,cpu-test]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install triton

      # Broader coverage than the CPU-only job above: with torch (and its
      # common companions installed just above) present, every
      # pytest.importorskip("torch")-guarded test actually runs instead of
      # self-skipping. Still no GPU -- this is the CPU wheel, not the CUDA
      # build, and sparkinfer/cutlass (the real SM120 kernel stack) are
      # deliberately NOT installed here -- so GPU-only and sparkinfer-only
      # tests still self-skip via their own skipif/importorskip guard.
      - name: Unit tests (CPU torch)
        run: python -m pytest -q
